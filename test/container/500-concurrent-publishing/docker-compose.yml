    cvmfs-test-s3:
        image: minio/minio:latest
        container_name: cvmfs-s3
        ports:
            - "9000:9000"   # S3 API
            - "9001:9001"   # Web UI
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin123
        volumes:
            - minio-data:/data
        command: server --console-address ":9001" /data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 1s
            timeout: 5s
            retries: 3
    
    cvmfs-test-s3-creator:
        image: minio/mc:latest
        container_name: cvmfs-s3-creator
        depends_on:
            cvmfs-test-s3:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            /usr/bin/mc alias set myminio http://cvmfs-s3:9000 minioadmin minioadmin123;
            /usr/bin/mc rb --force myminio/stratum0bucket;
            /usr/bin/mc mb myminio/stratum0bucket;
            /usr/bin/mc anonymous set public myminio/stratum0bucket;
            exit 0;
            "

volumes:
    var_spool_gw1:
    var_spool_gw2:
    var_spool_gw3:
    var_spool_gw4:
    var_spool_gw5:
    var_spool_pub1:
    var_spool_pub2:
    var_spool_pub3:
    var_spool_pub4:
    var_spool_pub5:
    minio-data:

