version: '3'

services:
    cvmfs-test-gw1:
        image: registry.cern.ch/cvmfs-dev:latest
        container_name: cvmfs-gw1
        hostname: cvmfs-gw1
        privileged: true
        cgroup: host # required to run sbin/init with cgroups v2
        build:
            context: ../../..
            dockerfile: test/container/500-concurrent-publishing/Dockerfile-dev-pub
        volumes:
            - /sys/fs/cgroup:/sys/fs/cgroup
            - ./keys/:/etc/cvmfs/keys
            - var_spool_gw1:/var/spool/cvmfs
            - ./config/gw1:/etc/cvmfs/gateway
            - ./scripts:/scripts
        ports:
            - "4929"
            - "80"

    cvmfs-test-gw2:
